[project]
name = "hpc-mcp-server"
version = "0.1.0"
description = "Execution-aware LLM MCP server for Tapis Pods."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "accelerate>=1.0.0",
    "deepspeed>=0.15.0",
    "fastapi>=0.115.0",
    "mcp>=1.12.0",
    "torch>=2.4.0",
    "transformers>=4.45.0",
    "uvicorn[standard]>=0.30.0",
]

[project.scripts]
hpc-mcp-server = "hpc_mcp_server.main:run"

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"
